services:
  - type: web
    name: blockade-box-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      # Optional: lets the leaderboard trust logged-in accounts.
      # Use the same public anon key that is inside your HTML.
      - key: SUPABASE_URL
        value: https://jhpmjfyxlpfrzvurybzg.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
